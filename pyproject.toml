[project]
name = "megaloman"
version = "0.0.1"
description = "Repeatable, declarative pipelines for NES Mega Man-style game assets"
requires-python = ">=3.12"
dependencies = ["pillow>=11", "numpy>=2", "pyyaml>=6"]

[project.scripts]
ml = "megaloman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megaloman"]
