[project]
name = "megaloman"
version = "0.0.1"
description = "Repeatable, declarative pipelines for NES Mega Man-style game assets"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "numpy>=2",
    "pyyaml>=6",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
# nespix text route (SDXL-Turbo imagination + CLIP judge). CPU wheels: --index-url https://download.pytorch.org/whl/cpu
nespix = ["torch>=2.4", "diffusers>=0.30", "transformers>=4.44", "accelerate>=0.33", "safetensors>=0.4"]

[project.scripts]
ml = "megaloman.cli:main"
nespix = "megaloman.nespix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megaloman"]
